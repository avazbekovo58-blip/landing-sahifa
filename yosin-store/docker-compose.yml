# =============================================================
# Yosin Store — full VPS stack
#   postgres : database
#   n8n      : Telegram bot + AI Agent + Mini App HTTP API
#   caddy    : HTTPS (Let's Encrypt) + serves Mini App build + reverse-proxy /api -> n8n
# All secrets come from .env (never committed). See .env.example.
# =============================================================
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
      # migrations + seed run automatically on FIRST init, in filename order
      - ./db/migrations:/docker-entrypoint-initdb.d/1-migrations:ro
      - ./db/seed:/docker-entrypoint-initdb.d/2-seed:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- n8n core ---
      N8N_HOST: ${DOMAIN}
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://${DOMAIN}/
      N8N_EDITOR_BASE_URL: https://${DOMAIN}/n8n/
      GENERIC_TIMEZONE: Asia/Tashkent
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- n8n's own metadata DB (separate schema on same postgres) ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
      DB_POSTGRESDB_USER: ${POSTGRES_USER}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_POSTGRESDB_SCHEMA: n8n
      # --- secrets consumed inside workflows (via $env) ---
      BOT_TOKEN: ${BOT_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - n8n
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./miniapp/dist:/srv/miniapp:ro   # built Mini App static files
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  n8n_data:
  caddy_data:
  caddy_config:
